[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sbs-ea"
version = "0.2.0"
description = "PFSP source-conditioned evolutionary search with exact evaluation budgets"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "LICENSES/*", "THIRD_PARTY.md"]
dependencies = ["numpy==2.0.0"]

[project.scripts]
sbs-ea = "sbs_ea.cli:main"

[project.optional-dependencies]
inference = ["torch>=2.6,<3", "transformers>=4.57,<6", "accelerate>=1.6,<2"]
service = ["httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.16.10", "mypy==1.20.2", "build==1.6.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sbs_ea*"]

[tool.setuptools.package-data]
sbs_ea = ["py.typed", "resource_catalog.json", "evidence_data/*.json", "evidence_data/*.tar.gz"]

[tool.pytest.ini_options]
norecursedirs = ["reference", ".*", "build", "dist", "*.egg"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = ["repro_assets: requires private paper, benchmark, or frozen evidence assets"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tests/reference", "reproduce", "build", "dist"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sbs_ea/resources.py", "src/sbs_ea/source_ea/models.py", "src/sbs_ea/settings.py", "src/sbs_ea/datasets.py", "src/sbs_ea/artifacts.py", "src/sbs_ea/execution.py", "src/sbs_ea/cli.py", "src/sbs_ea/reproduction.py"]
follow_imports = "silent"
